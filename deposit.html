<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar Dinero - Wall-et</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="text-center mb-4">Realizar Depósito</h2>
                        <form id="formularioDeposito">
                            <div class="mb-3">
                                <label for="montoDeposito" class="form-label">Monto a depositar ($):</label>
                                <input type="number" class="form-control" id="montoDeposito" placeholder="Ej: 5000"
                                    min="1" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mb-3">Realizar depósito</button>
                            <a href="menu.html" class="btn btn-secondary w-100">Volver al Menú</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 1. jQuery (Obligatorio para que los scripts funcionen) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- 2. Bootstrap JS (Para que los componentes como modales y botones respondan) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 3. Tu script específico de depósito -->
    <script src="js/deposit.js"></script>
</body>
