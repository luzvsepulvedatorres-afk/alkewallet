<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!-- Archivo CSS separado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">Depositar Dinero</h2>
            <form id="depositForm">
                <div class="form-group">
                    <label for="amount">Monto a depositar (CLP):</label>
                    <input type="number" class="form-control" id="amount" placeholder="Ej: 10000" required>
                </div>
                <button type="submit" class="btn btn-success btn-block">Confirmar Depósito</button>
            </form>
            <a href="menu.html" class="btn btn-secondary btn-block mt-3">Volver al Menú</a>
        </div>
    </div>
</body>
</html>
