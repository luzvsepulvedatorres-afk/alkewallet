<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Wall-et</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow text-center p-4">
                    <h2 class="mb-3">Bienvenido a tu Billetera</h2>

                    <!-- Saldo actual que se actualiza dinámicamente -->
                    <div class="alert alert-success">
                        <h4>Saldo Actual:</h4>
                        <h1 id="balanceDisplay">$1000</h1>
                    </div>

                    <div class="d-grid gap-3 mt-4">
                        <button onclick="redirigir('deposit.html', 'depósito')"
                            class="btn btn-primary btn-lg">Depositar</button>
                        <button onclick="redirigir('sendmoney.html', 'enviar dinero')"
                            class="btn btn-warning btn-lg text-white">Enviar Dinero</button>
                        <button onclick="redirigir('transactions.html', 'últimos movimientos')"
                            class="btn btn-secondary btn-lg">Últimos Movimientos</button>
                    </div>

                    <!-- Leyenda que pide el profesor -->
                    <div id="mensajeRedireccion" class="mt-3 text-center text-primary fw-bold"></div>

                    <div class="mt-4">
                        <a href="login.html" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 1. Carga jQuery primero -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- 2. Bootstrap JS (Fundamental para que el diseño y los botones funcionen) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 3. Tu script de menú -->
    <script src="js/menu.js"></script>
</body>
</html>
