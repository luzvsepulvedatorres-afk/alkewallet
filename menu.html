<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Wall-et</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow text-center p-4">
                    <h2 class="mb-3">Bienvenido a tu Billetera</h2>
                    
                    <!-- Saldo actual que se actualiza dinámicamente -->
                    <div class="alert alert-success">
                        <h4>Saldo Actual:</h4>
                        <h1 id="balanceDisplay">$1000</h1>
                    </div>

                    <div class="d-grid gap-3 mt-4">
                        <a href="deposit.html" class="btn btn-primary btn-lg">Depositar</a>
                        <a href="sendmoney.html" class="btn btn-warning btn-lg text-white">Enviar Dinero</a>
                        <a href="transactions.html" class="btn btn-secondary btn-lg">Últimos Movimientos</a>
                    </div>

                    <div class="mt-4">
                        <a href="login.html" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script para cargar el saldo -->
    <script src="js/menu.js"></script>
</body>
</html>
