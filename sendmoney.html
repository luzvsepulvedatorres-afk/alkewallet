<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Enviar Dinero</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!-- Archivo CSS separado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">Enviar Dinero</h2>
            <form id="sendForm">
                <div class="form-group">
                    <label for="contacto">Contacto o Cuenta:</label>
                    <input type="text" class="form-control" id="contacto" placeholder="Nombre o número de cuenta" required>
                </div>
                <div class="form-group">
                    <label for="montoEnvio">Monto a enviar (CLP):</label>
                    <input type="number" class="form-control" id="montoEnvio" placeholder="Ej: 5000" required>
                </div>
                <button type="submit" class="btn btn-warning btn-block text-white">Realizar Transferencia</button>
            </form>
            <a href="menu.html" class="btn btn-secondary btn-block mt-3">Volver al Menú</a>
        </div>
    </div>
</body>
</html>
